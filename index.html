<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Limite Violetto runs locally in your browser with jax-js and WebGPU."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%235727e6'/%3E%3Cpath d='M15 19h34v7H27l19 19H35L15 25z' fill='white'/%3E%3C/svg%3E"
    />
    <title>kalkulator</title>
  </head>
  <body>
    <main>
      <header>
        <h1>kalkulator</h1>
        <span>Violetto 1B · local WebGPU</span>
      </header>

      <section class="workbench">
        <form id="prompt-form">
          <label for="prompt">Problem</label>
          <textarea
            id="prompt"
            rows="6"
            spellcheck="false"
            placeholder="Type a mathematics problem…"
            required
          ></textarea>
          <div class="form-row">
            <small id="hint">1.93 GiB model download.</small>
            <button id="run" type="submit">Solve</button>
          </div>
        </form>

        <article id="result" aria-live="polite">
          <div class="result-head">
            <span>Solution</span>
            <span id="status">idle</span>
          </div>
          <div id="answer" class="answer muted">Ready.</div>
          <svg id="trace" aria-label="Generation speed"></svg>
        </article>
      </section>

      <footer>
        <span>Runs on your GPU. Nothing is sent.</span>
        <span><a href="https://paradigma.inc/blog/limite-1b-violetto/">model</a> · <a href="https://jax-js.com">runtime</a></span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
