<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Violetto for mathematics, running in your browser with JAX.js and WebGPU."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="Kalkulator" />
    <meta
      property="og:description"
      content="Violetto for mathematics, running in your browser with JAX.js and WebGPU."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gustofied.github.io/kalkulator/" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23ffffff'/%3E%3Ctext x='12' y='49' font-family='serif' font-size='50' fill='%23181818'%3EK%3C/text%3E%3C/svg%3E" />
    <title>Kalkulator</title>
  </head>
  <body>
    <a class="skip-link preparing" href="#prompt" aria-hidden="true" tabindex="-1">Skip to problem</a>
    <main id="main-content">
      <form id="prompt-form" class="preparing" aria-hidden="true">
        <div class="prompt-line">
          <label class="visually-hidden" for="prompt">Problem</label>
          <input
            id="prompt"
            type="text"
            spellcheck="false"
            autocomplete="off"
            aria-describedby="hint"
            placeholder="write a problem"
            disabled
            required
          />
          <button id="run" type="submit" disabled>ask</button>
        </div>
        <small id="hint" class="visually-hidden">The model is kept on this machine after its first use.</small>
        <span id="status" class="visually-hidden" aria-live="polite" aria-atomic="true">idle</span>
        <output id="benchmark-output" class="visually-hidden"></output>
      </form>

      <article id="result" aria-label="Violetto answer">
        <section id="answer-section" class="answer-section waiting">
          <div id="answer" class="answer">
            <figure id="answer-art" class="answer-art" aria-hidden="true">
              <img class="answer-art-ghost" src="./gothic-k-scholar.png" alt="" />
              <img class="answer-art-ink" src="./gothic-k-scholar.png" alt="" />
            </figure>
            <div id="answer-copy" class="answer-copy">
              <div id="work-copy" class="work-copy"></div>
              <div id="final-copy" class="final-copy" aria-live="polite"></div>
            </div>
          </div>
        </section>
      </article>

    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
