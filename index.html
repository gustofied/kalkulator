<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Limite Violetto runs locally in your browser with jax-js and WebGPU."
    />
    <meta property="og:title" content="Kalkulator" />
    <meta
      property="og:description"
      content="Paradigma's Limite 1B Violetto, running locally with JAX.js and WebGPU."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kalkulator.adamsioud.com" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23eeeae1'/%3E%3Ctext x='12' y='49' font-family='serif' font-size='50' fill='%231b1916'%3EK%3C/text%3E%3C/svg%3E" />
    <title>Kalkulator — Violetto in your browser</title>
  </head>
  <body>
    <a class="skip-link" href="#prompt">Skip to problem</a>
    <main id="main-content">
      <header class="site-header">
        <h1>Kalkulator</h1>
        <p class="imprint">Violetto · in-browser mathematics</p>
      </header>

      <form id="prompt-form">
        <div class="prompt-line">
          <label class="visually-hidden" for="prompt">Problem</label>
          <textarea
            id="prompt"
            rows="1"
            spellcheck="false"
            autocomplete="off"
            aria-describedby="hint"
            placeholder="Write a problem…"
            required
          ></textarea>
          <button id="run" type="submit"><span>ask</span></button>
        </div>
        <div class="form-meta">
          <small id="hint">The model is kept on this machine after its first use.</small>
          <span id="status" aria-live="polite" aria-atomic="true">idle</span>
        </div>
      </form>

      <article id="result" aria-label="Violetto answer">
        <section id="answer-section" class="answer-section waiting">
          <div id="answer" class="answer" aria-live="polite">
            <figure id="answer-art" class="answer-art" aria-hidden="true">
              <img src="./letter-k-holbein.jpg" alt="" />
            </figure>
            <div id="answer-copy" class="answer-copy"></div>
          </div>
        </section>
      </article>

      <footer class="site-footer">
        <span>Private; the work remains on your GPU.</span>
        <span><a href="https://huggingface.co/paradigma-inc/limite-1b-violetto">Limite</a> · <a href="https://jax-js.com">JAX.js</a> · WebGPU</span>
        <span>Woodcut after <a href="https://www.nga.gov/artworks/11935-letter-k">Holbein, c. 1523</a></span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
