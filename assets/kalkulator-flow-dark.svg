<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 176" role="img" aria-labelledby="title description">
  <title id="title">Kalkulator</title>
  <desc id="description">A problem passes through Violetto, running on JAX.js and WebGPU, to produce an answer. All inference takes place in your browser.</desc>
  <style>
    text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .frame { fill: none; stroke: #413749; }
    .box { fill: none; stroke: #74637f; }
    .line { fill: none; stroke: #baa3cf; marker-end: url(#arrow); }
    .label { fill: #ded6e5; font-size: 18px; text-anchor: middle; }
    .note { fill: #a99bb5; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#baa3cf"/>
    </marker>
  </defs>
  <rect class="frame" x="12.5" y="20.5" width="775" height="143"/>
  <text class="note" x="32" y="46" letter-spacing="1.5">YOUR BROWSER</text>
  <g stroke-width="1">
    <rect class="box" x="32.5" y="74.5" width="155" height="63"/>
    <rect class="box" x="272.5" y="74.5" width="255" height="63"/>
    <rect class="box" x="612.5" y="74.5" width="155" height="63"/>
    <path class="line" d="M188 106 H267"/>
    <path class="line" d="M528 106 H607"/>
  </g>
  <text class="label" x="110" y="112">Problem</text>
  <text class="label" x="400" y="101">Violetto</text>
  <text class="note" x="400" y="122" text-anchor="middle">JAX.js / WebGPU</text>
  <text class="label" x="690" y="112">Answer</text>
</svg>
